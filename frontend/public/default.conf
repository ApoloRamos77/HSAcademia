server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre (Vite): caché larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca en caché: cada despliegue se ve de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA: cualquier ruta del frontend (/academy/..., /a/...) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No servir los archivos de construcción del contenedor
    location ~ ^/(Dockerfile|default\.conf)$ { return 404; }
}
